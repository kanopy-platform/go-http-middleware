---
kind: pipeline
type: kubernetes
name: default

trigger:
  branch: [main]

workspace:
  path: /go/src/github.com/${DRONE_REPO}

steps:
  - name: test
    image: golangci/golangci-lint:v2.4.0

    commands:
      - make test

  - name: license-check
    image: public.ecr.aws/kanopy/licensed-go:3.4.4
    commands:
      - licensed cache
      - licensed status
